<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <style>
      .cd-orange { fill: #e87500; }
      .cd-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 800; fill: #e87500; }
    </style>
  </defs>
  <!-- Stylized Urdu Letter 'Che' / Swash -->
  <path class="cd-orange" d="M100,10 C108,10 114,14 116,20 C118,27 111,33 100,38 C79,47 66,64 64,88 C63,109 72,124 85,134 C75,131 67,123 62,113 C56,100 55,80 67,52 C77,29 89,16 100,10 Z" />
  
  <!-- 3 Dots of Che (چ) -->
  <polygon class="cd-orange" points="93,52 100,45 107,52 100,59" />
  <polygon class="cd-orange" points="113,52 120,45 127,52 120,59" />
  <polygon class="cd-orange" points="103,68 110,61 117,68 110,75" />
  
  <!-- Shopping Bag / Curved Body -->
  <path class="cd-orange" d="M62,102 C66,92 76,86 87,84 C95,83 102,87 107,93 C113,87 123,84 132,86 C144,90 151,100 151,114 C151,136 135,156 107,156 C79,156 61,134 62,102 Z" />
  
  <!-- 'Zay' English text cutout inside orange bag -->
  <text x="106" y="128" font-size="34" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-1">Zay</text>
  
  <!-- Cheezay Dikhao Brand Name -->
  <text x="100" y="186" class="cd-text" font-size="21" text-anchor="middle" letter-spacing="-0.3">Cheezay Dikhao</text>
</svg>
